description: "maps: offline slippy-map viewer — an LCD launcher program that blits pre-baked tiles (JPEG, raw .bin fallback) from SD, centred on the live GPS fix read via ephemeral storage."
url: https://github.com/reticulous/maps
version: "0.1.0"
license: "Apache-2.0"
targets:
  - esp32s3
  - esp32p4
dependencies:
  idf:
    version: ">=5.5"
  espressif/esp_jpeg:
    version: "^1.1"
